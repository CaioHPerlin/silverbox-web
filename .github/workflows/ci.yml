name: CI
on:
  push:
    branches: [main, feature/ci-cd]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this revision to Oracle after validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.detect.outputs.npm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node --test .github/scripts/*.test.cjs
      - uses: actions/github-script@v7
        id: detect
        with:
          script: |
            const { detect } = require('./.github/scripts/npm-changes.cjs');
            core.setOutput('npm', String(detect(context)));

  pnpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: silverbox-web-test:${{ github.sha }}
          cache-from: type=gha,scope=web-test-amd64
          cache-to: type=gha,scope=web-test-amd64,mode=max
      - run: pnpm test
        env:
          TEST_IMAGE: silverbox-web-test:${{ github.sha }}
  npm:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
  deploy:
    needs: [pnpm, npm]
    if: >-
      always() && !cancelled() && needs.pnpm.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
